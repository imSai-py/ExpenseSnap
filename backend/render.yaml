databases:
  - name: expensesnap_db
    plan: free
    databaseName: expensesnap_db
    user: expensesnap_user

services:
  - type: web
    name: expensesnap-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: expensesnap_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GCLOUD_CLIENT_ID
        sync: false
      - key: GCLOUD_CLIENT_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CONTACT_EMAIL
        sync: false
