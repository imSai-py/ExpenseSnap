<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseSnap - Track Your Expenses</title>
  <meta name="description" content="Track, manage, and visualize your daily expenses with AI-powered insights." />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme color for browser address bar (Android Chrome) -->
  <meta name="theme-color" content="#A855F7" />

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ExpenseSnap" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!--
    ANTI-FLICKER SCRIPT — runs synchronously BEFORE React loads.
    Reads the stored theme from localStorage and applies the `dark` class
    to <html> immediately to prevent white flash on dark-mode loads.
  -->
  <script>
    (function() {
      var stored = localStorage.getItem('expensesnap-theme');
      var isDark = false;
      if (stored === 'dark') {
        isDark = true;
      } else if (stored === 'light') {
        isDark = false;
      } else {
        // 'system' or no preference: check OS
        isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      if (isDark) {
        document.documentElement.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#0F172A');
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
